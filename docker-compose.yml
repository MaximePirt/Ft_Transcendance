services:

  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    container_name: nginx
    networks:
      - ft_transcendance
    depends_on:
      vault_agent:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/data/logs:/var/log/nginx
      - ./infrastructure/nginx/data/certs:/etc/nginx/certs
      - vault-secrets:/secrets:ro
      - ./shared:/scripts:ro
      - modsec-data:/var/cache/modsecurity




  front:
    build:
      context: ./services/front
      dockerfile: Dockerfile
    container_name: front
    networks:
      - ft_transcendance
    #TODO: This port exposure is only for development purposes
    ports:
      - "5173:5173"
    environment:
      - FRONT_URL=https://localhost/
    volumes:
      - ./services/front:/app
      - front_node_modules:/app/node_modules
    restart: on-failure
    
